name: Generar APK de NeshTV

on:
  push:
    branches:
      - main # Se ejecuta automáticamente al subir cambios a la rama main
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Versión requerida para compilar Android

      - name: Instalar dependencias y compilar web
        run: |
          npm install
          npm run build

      - name: Copilar assets web a Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK (Modo Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: NeshTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
