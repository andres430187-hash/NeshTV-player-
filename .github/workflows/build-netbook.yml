name: Generar Software Netbook (Windows y Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Software Panel para Windows
    runs-on: windows-latest

    steps:
      - name: 1. Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Dependencias del Proyecto
        run: npm install --legacy-peer-deps --force

      - name: 4. Compilar Aplicación
        run: npm run build:netbook

      - name: 5. Fabricar Instalador de Escritorio (.exe)
        shell: bash
        run: |
          mkdir -p electron-app
          cp -r netbook-dist electron-app/
          cd electron-app

          cat << 'EOF' > package.json
          {
            "name": "neshtv-panel",
            "version": "1.0.0",
            "description": "Panel de Administración NeshTV",
            "author": "NeshTV",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --win"
            },
            "build": {
              "appId": "com.neshtv.panel",
              "productName": "NeshTV Panel",
              "directories": {
                "output": "dist-electron"
              },
              "win": {
                "target": "nsis"
              }
            },
            "devDependencies": {
              "electron": "^29.1.0",
              "electron-builder": "^24.13.3"
            }
          }
          EOF

          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');

          function createWindow () {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            win.loadURL('https://neshtv-player-pro.onrender.com');
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

          npm install
          npm run build

      - name: 6. Subir Instalador Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NeshTV-Panel-Instalador-Windows-EXE
          path: electron-app/dist-electron/*.exe
          retention-days: 30

  build-linux:
    name: Compilar Software Panel para Linux
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Dependencias del Proyecto
        run: npm install --legacy-peer-deps --force

      - name: 4. Compilar Aplicación
        run: npm run build:netbook

      - name: 5. Fabricar Ejecutable Linux (.AppImage)
        run: |
          mkdir -p electron-app
          cp -r netbook-dist electron-app/
          cd electron-app

          cat << 'EOF' > package.json
          {
            "name": "neshtv-panel",
            "version": "1.0.0",
            "description": "Panel de Administración NeshTV",
            "author": "NeshTV",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --linux"
            },
            "build": {
              "appId": "com.neshtv.panel",
              "productName": "NeshTV Panel",
              "directories": {
                "output": "dist-electron"
              },
              "linux": {
                "target": "AppImage"
              }
            },
            "devDependencies": {
              "electron": "^29.1.0",
              "electron-builder": "^24.13.3"
            }
          }
          EOF

          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1280, height: 720, autoHideMenuBar: true,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadURL('https://neshtv-player-pro.onrender.com');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF

          npm install
          npm run build

      - name: 6. Subir Ejecutable Linux (.AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: NeshTV-Panel-Instalador-Linux
          path: electron-app/dist-electron/*.AppImage
          retention-days: 30
